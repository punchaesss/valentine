<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<title>💌 ส่งความรัก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body {
    background-image: url(1.png);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    font-family: 'Great Vibes', cursive;
    font-size: 26px;

    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
  background: transparent;
  text-align: center;
}

/* หัวข้อ */
.card h2 {
  font-family: 'Great Vibes', cursive;
  font-size: 80px;
  margin-bottom: 30px;
  color: #630909;
  font-weight: 400;
}

/* textarea */
textarea {
  font-family: 'Great Vibes', cursive;
  width: 100%;
  height: 28px;
  background: transparent;
  border: none;
  border-bottom: 2px solid #510d0d;
  font-size: 28px;
  resize: none;
  outline: none;
  color: #510d0d;
  padding-bottom: 10px;
}

textarea::placeholder {
  color: rgba(81,13,13,0.4);
}

textarea:focus {
  border-bottom-color: #510d0d;
}

/* ซ่อน input file */
input[type="file"] {
  display: none;
}

/* เลือกรูป */
.file-upload {
  font-family: 'Great Vibes', cursive;
  display: block;
  margin-top: 25px;
  padding: 4px;
  border-bottom: 2px solid #510d0d;
  cursor: pointer;
  color: rgba(81,13,13,0.5);
  text-align: left;
  font-size: 26px;
}

.file-upload:hover {
  opacity: 0.7;
}

/* ปุ่มส่ง */
button {
  margin-top: 35px;
  background-color: #510d0d;
  border-radius: 30px;
  padding: 12px 0;
  width: 100%;
  font-size: 26px;
  font-family: 'Great Vibes', cursive;
  cursor: pointer;
  color: white;
  transition: all 0.3s ease;
}

button:hover {
  background-color: #7a1a1a;
}

/* สถานะ */
.status {
  font-family: 'Great Vibes', cursive;
  font-size: 24px;
  margin-top: 15px;
  color: #510d0d;
}

/* ชื่อไฟล์ */
.file-name {
  margin-top: 6px;
  font-size: 22px;
  color: #510d0d;
  text-align: left;
}

/* preview รูป */
.preview-img {
  margin: 12px auto 0;
  max-width: 100%;
  max-height: 300px;
  border-radius: 12px;
  display: none;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  object-fit: cover;
}


</style>
</head>

<body>

<div class="card">
  <h2>Your love message</h2>

  <textarea id="text" placeholder="type..."></textarea>

  <!-- <label for="imageInput" class="file-upload">
    Choose image
  </label>
  <input type="file" id="imageInput" accept="image/*"> -->
<label for="imageInput" class="file-upload">
  Choose image
</label>
<input type="file" id="imageInput" accept="image/*">

<!-- แสดงชื่อไฟล์ -->
<div id="fileName" class="file-name"></div>

<!-- preview รูป -->
<img id="preview" class="preview-img" />

  <button id="sendBtn">Send</button>
  <div class="status" id="status"></div>
</div>








<script type="module">
/* 🔥 Firebase (v12 – module) */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } 
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* 🔑 Firebase config (ของคุณ) */
const firebaseConfig = {
  apiKey: "AIzaSyAdnNofaKHq0DymEwB4tVhoOsjsmNiaW0g",
  authDomain: "love-c3e16.firebaseapp.com",
  projectId: "love-c3e16",
  storageBucket: "love-c3e16.firebasestorage.app",
  messagingSenderId: "1006520162203",
  appId: "1:1006520162203:web:a6f0a69b4c8238bd76333e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🖼 freeimage.host */
const IMGBB_API_KEY = "d7ff3b59225fef396757e8e7fb8b1434";

async function uploadImage(file) {
    const formData = new FormData();
    formData.append("image", file);

    const res = await fetch(
        `https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`,
        {
            method: "POST",
            body: formData
        }
    );

    const data = await res.json();

    if (!data.success) {
        console.error(data);
        throw new Error("Upload failed");
    }

    return data.data.url; // ⭐ URL รูปที่ใช้แสดงได้ทันที
}


document.getElementById("sendBtn").onclick = async () => {
    const text = document.getElementById("text").value.trim();
    const fileInput = document.getElementById("imageInput");
    const file = fileInput.files[0];
    const status = document.getElementById("status");

    if (!text && !file) {
        alert("กรุณาพิมพ์ข้อความหรือเลือกรูปอย่างใดอย่างหนึ่ง ");
        return;
    }

    status.textContent = "waiting...";
    let imageUrl = "";

    try {
        if (file) {
            imageUrl = await uploadImage(file);
        }

        await addDoc(collection(db, "messages"), {
            text,
            imageUrl,
            createdAt: serverTimestamp()
        });

        status.textContent = "succesful!";
        document.getElementById("text").value = "";
        fileInput.value = "";

    } catch (err) {
        console.error(err);
        alert("ส่งไม่สำเร็จ");
        status.textContent = "";
    }
};

const imageInput = document.getElementById("imageInput");
const fileNameEl = document.getElementById("fileName");
const preview = document.getElementById("preview");

imageInput.addEventListener("change", () => {
  const file = imageInput.files[0];

  if (!file) return;

  // แสดงชื่อไฟล์
  fileNameEl.textContent = file.name;

  // แสดง preview รูป
  const reader = new FileReader();
  reader.onload = e => {
    preview.src = e.target.result;
    preview.style.display = "block";
  };
  reader.readAsDataURL(file);
});

</script>

</body>
</html>
