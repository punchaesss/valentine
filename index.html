<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💌 ส่งความรัก</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b9d 0%, #c06c84 50%, #f67280 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #e91e63;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .hearts {
            font-size: 2em;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #c2185b;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 3px solid #f8bbd0;
            border-radius: 15px;
            font-size: 16px;
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
            transition: all 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #e91e63;
            box-shadow: 0 0 15px rgba(233, 30, 99, 0.3);
        }

        .image-upload {
            position: relative;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            border: 3px dashed #e91e63;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .image-upload:hover {
            background: linear-gradient(135deg, #f8bbd0 0%, #f48fb1 100%);
            transform: scale(1.02);
        }

        .image-upload input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        #preview {
            margin-top: 15px;
            max-width: 100%;
            border-radius: 15px;
            display: none;
        }

        .btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(233, 30, 99, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(233, 30, 99, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .success-message {
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            margin-top: 20px;
            display: none;
            animation: slideIn 0.5s;
        }

        .floating-hearts {
            position: fixed;
            font-size: 2em;
            animation: float 4s infinite;
            pointer-events: none;
            opacity: 0.6;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="hearts">💕</div>
            <h1>ส่งความรัก</h1>
            <p style="color: #c2185b;">แชร์ความรู้สึกดีๆ ของคุณ</p>
        </div>

        <form id="messageForm">
            <div class="form-group">
                <label>💌 ข้อความของคุณ</label>
                <textarea id="messageText" placeholder="เขียนข้อความหวานๆ ที่นี่..." required></textarea>
            </div>

            <div class="form-group">
                <label>📷 เพิ่มรูปภาพ (ถ้ามี)</label>
                <label for="imageInput" class="image-upload">
                    <div class="upload-icon">🖼️</div>
                    <div>คลิกเพื่ออัพโหลดรูปภาพ</div>
                    <input type="file" id="imageInput" accept="image/*">
                </label>
                <img id="preview" alt="Preview">
            </div>

            <button type="submit" class="btn">💖 ส่งความรัก 💖</button>
        </form>

        <div class="success-message" id="successMessage">
            ✨ ส่งความรักสำเร็จแล้ว! ✨
        </div>
    </div>

    <script>
        // Preview image
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('preview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        // Floating hearts animation
        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-hearts';
            heart.textContent = ['❤️', '💕', '💖', '💗', '💝'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 5000);
        }

        setInterval(createFloatingHeart, 1000);

        // Handle form submission
        document.getElementById('messageForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const messageText = document.getElementById('messageText').value;
            const imageInput = document.getElementById('imageInput').files[0];
            
            const message = {
                text: messageText,
                timestamp: new Date().toISOString(),
                id: Date.now()
            };

            // Convert image to base64 if exists
            if (imageInput) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    message.image = e.target.result;
                    saveMessage(message);
                }
                reader.readAsDataURL(imageInput);
            } else {
                saveMessage(message);
            }
        });

        function saveMessage(message) {
            // Get existing messages
            let messages = JSON.parse(localStorage.getItem('valentineMessages') || '[]');
            messages.push(message);
            localStorage.setItem('valentineMessages', JSON.stringify(messages));
            
            // Show success message
            const successMsg = document.getElementById('successMessage');
            successMsg.style.display = 'block';
            
            // Create heart burst effect
            for (let i = 0; i < 10; i++) {
                setTimeout(createFloatingHeart, i * 100);
            }
            
            // Reset form
            setTimeout(() => {
                document.getElementById('messageForm').reset();
                document.getElementById('preview').style.display = 'none';
                successMsg.style.display = 'none';
            }, 2000);
        }
    </script>
</body>
</html>
