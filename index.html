.card {
  background: transparent;     /* ไม่มีสี */
  width: 320px;
  text-align: center;
  font-family: 'Segoe UI', sans-serif;
}

/* หัวข้อ */
.card h2 {
   font-family: 'Sacramento', cursive;
  font-size: 36px;
  margin-bottom: 30px;
  color: #630909;
  font-weight: 500;
}

/* textarea เส้นใต้เดียว */
textarea {
  font-family: 'Sacramento', cursive;
  width: 100%;
  height: 20px;
  background: transparent;
  border: none;
  border-bottom: 2px solid #510d0d;
  font-size: 18px;
  resize: none;
  outline: none;
    color: #510d0d;
  padding: 20px 0 6px 0;

}

textarea::placeholder {
  color: #0b000081;
  
  /* padding-top: 14px; */
}

textarea:focus {
  border-bottom-color: #510d0d;
}

/* ซ่อน input file ดิบ */
input[type="file"] {
  display: none;
}

/* ปุ่มเลือกไฟล์แบบเส้นใต้ */
.file-upload {
  font-family: 'Sacramento', cursive;
  display: block;
  margin-top: 25px;
  padding: 4px;
  border-bottom: 2px solid #510d0d;
  cursor: pointer;
  color: #0b000081;
  transition: all 0.3s ease;
    text-align: left;
}

.file-upload:hover {
  opacity: 0.6;
}

/* ปุ่มส่ง */
button {
  margin-top: 35px;
background-color: #510d0d;
  border: 2px solid #000;
  border-radius: 30px;
  padding: 10px 0;
  width: 100%;
  font-size: 18px;
  font-family: 'Sacramento', cursive;
  cursor: pointer;
  color: white;
  transition: all 0.3s ease;
}

button:hover{
    background-color: #510d0d70;
    border-color: transparent;
}

/* สถานะ */
.status {
 font-family: 'Sacramento', cursive;
  font-size: 18px;
  margin-top: 15px;
  font-size: 14px;
  color: #510d0d;
}

<body>

<div class="card">
  <h2>Your love message</h2>

  <textarea id="text" placeholder="type..."></textarea>

  <label for="imageInput" class="file-upload">
    Choose image
  </label>
  <input type="file" id="imageInput" accept="image/*">

  <button id="sendBtn">Send</button>
  <div class="status" id="status"></div>
</div>








<script type="module">
/* 🔥 Firebase (v12 – module) */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } 
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* 🔑 Firebase config (ของคุณ) */
const firebaseConfig = {
  apiKey: "AIzaSyAdnNofaKHq0DymEwB4tVhoOsjsmNiaW0g",
  authDomain: "love-c3e16.firebaseapp.com",
  projectId: "love-c3e16",
  storageBucket: "love-c3e16.firebasestorage.app",
  messagingSenderId: "1006520162203",
  appId: "1:1006520162203:web:a6f0a69b4c8238bd76333e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🖼 freeimage.host */
const IMGBB_API_KEY = "d7ff3b59225fef396757e8e7fb8b1434";

async function uploadImage(file) {
    const formData = new FormData();
    formData.append("image", file);

    const res = await fetch(
        `https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`,
        {
            method: "POST",
            body: formData
        }
    );

    const data = await res.json();

    if (!data.success) {
        console.error(data);
        throw new Error("Upload failed");
    }

    return data.data.url; // ⭐ URL รูปที่ใช้แสดงได้ทันที
}


document.getElementById("sendBtn").onclick = async () => {
    const text = document.getElementById("text").value.trim();
    const fileInput = document.getElementById("imageInput");
    const file = fileInput.files[0];
    const status = document.getElementById("status");

    if (!text && !file) {
        alert("กรุณาพิมพ์ข้อความหรือเลือกรูปอย่างใดอย่างหนึ่ง ");
        return;
    }

    status.textContent = "waiting...";
    let imageUrl = "";

    try {
        if (file) {
            imageUrl = await uploadImage(file);
        }

        await addDoc(collection(db, "messages"), {
            text,
            imageUrl,
            createdAt: serverTimestamp()
        });

        status.textContent = "successful!";
        document.getElementById("text").value = "";
        fileInput.value = "";

    } catch (err) {
        console.error(err);
        alert("ส่งไม่สำเร็จ");
        status.textContent = "";
    }
};

</script>
